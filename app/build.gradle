plugins {
    id 'com.android.application'
}

android {
    namespace 'com.picoxr.resfix'
    compileSdk 34

    defaultConfig {
        applicationId "com.picoxr.resfix"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Xposed API is provided by the LSPosed/Vector framework at runtime.
    // We compile against the local stub jar (compileOnly) so the real Xposed
    // classes are NOT bundled into the APK (Vector refuses modules that bundle them).
    compileOnly files('libs/xposed-api.jar')
}
