pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }   // fallback for any libs
        maven { url 'https://jcenter.bintray.com/' } // Xposed api (legacy but still served)
    }
}
rootProject.name = "resfix-gui"
include ':app'
